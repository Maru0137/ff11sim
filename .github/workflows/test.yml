name: Test

# 検証専用のワークフロー。配信 (deploy.yml) とは目的が違うので分けている。
#
#   pull_request  … マージ前に検証する
#   workflow_call … deploy.yml から呼ばれ、ビルドの前段として走る
#
# push は入れていない。main への push では deploy.yml がこれを呼ぶため、
# 両方を trigger にすると同じテストが 2 回走る。
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rust-toolchain.toml に固定したツールチェーンを取得する。バージョンを
      # ワークフロー側にも書くと二重管理になるため指定しない。
      - name: Setup Rust
        run: rustup show active-toolchain

      # 整形検査はコンパイルを伴わないので、装備データの生成より前に置いて早く落とす。
      # pre-commit でも同じ検査をしているが、--no-verify で迂回できるためここでも見る。
      - name: Check formatting
        run: cargo fmt --check
        working-directory: rust

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # config.js は .gitignore 済みで、本物は deploy.yml が Secrets から生成する。
      # 無いと import が 404 になりページ全体が読み込めないため、テンプレを流用する。
      # typecheck の import 解決とスモークテストの両方で使う。
      # スモークはログイン機能を検証しないので値はプレースホルダで足りる。
      - name: Generate placeholder config
        run: cp web/js/config.example.js web/js/config.js

      # 未定義識別子 (no-undef) の検出が主目的。削除した JS モジュールの識別子を
      # index.html が参照し続け、本番でステータスが全て 0 になる事故があった。
      # インライン <script> も検査対象 (eslint-plugin-html)。
      - name: Lint JS
        run: npm run lint

      # React / TS 層 (web/src/) の型検査。未定義識別子の検出もここが担う
      # (eslint の no-undef は TS には適用しない)。
      - name: Typecheck
        run: npm run typecheck

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 装備データは include_str! でバイナリに埋め込まれるため (docs/adr/0009)、
      # items.json が無いとコンパイルできない。テストの前に生成する必要がある。
      - name: Resolve upstream digest
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/upstream_common.sh
          echo "digest=$(upstream_digest)" >> "$GITHUB_OUTPUT"

      # 上流の blob SHA と変換スクリプトが同じなら items.json も同じになるので、
      # 生成結果を使い回して上流への再ダウンロードとパースを省く。
      - name: Restore items.json cache
        id: items-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/items.json
            build/.items-signature
          key: items-json-${{ steps.upstream.outputs.digest }}-${{ hashFiles('scripts/parse_lua_to_json.py') }}

      - name: Build data
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build_data.sh

      - name: Save items.json cache
        if: steps.items-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/items.json
            build/.items-signature
          key: items-json-${{ steps.upstream.outputs.digest }}-${{ hashFiles('scripts/parse_lua_to_json.py') }}

      # clippy は装備データの生成後に置く。コンパイルを伴うため
      # include_str! の対象 (build/items.json) が必要になる。
      - name: Run clippy
        run: cargo clippy --lib --tests -- -D warnings
        working-directory: rust

      # release で走らせるのは ja_en_conformance が全 15,000 件の装備に対して
      # 正規表現抽出を 2 通り回すため。debug では最適化が効かず、この 1 本だけで
      # 約 150 秒かかる (release では約 8 秒)。ビルド時間は release の方が
      # 数秒長いが、実行時間の差で十分に元が取れる (実測 debug 122s / release 28s)。
      - name: Run tests
        run: cargo test --release
        working-directory: rust

      # ---- スモークテスト ----
      # ページを実際に開き「コンソールエラーが無い」「ステータスが 0 でない」を見る。
      # Rust のテストが全て通っていても、JS の参照漏れや WASM の初期化失敗で
      # ページ全体が動かないことがある (実際に起きた)。その層はここでしか検出できない。

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Build WASM
        run: wasm-pack build rust --target web --out-dir ../web/pkg

      # ユニットテスト (Vitest)。equip-bonuses のテストが実 WASM を使うため
      # Build WASM の後に置く (web/pkg のバイト列を node から読み込む)。
      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      # 失敗時の調査用にトレースを残す
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
