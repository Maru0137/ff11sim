<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXI 装備検索</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .auth-ui {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }
        .auth-ui .auth-user { color: #aaa; }
        .auth-ui .auth-btn {
            background: #16213e;
            color: #eee;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .auth-ui .auth-btn:hover { background: #1f2a4a; }
        .auth-ui .auth-btn-google { background: #4285f4; border-color: #4285f4; }
        .auth-ui .auth-btn-google:hover { background: #357ae8; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #f0c040;
            margin-bottom: 20px;
        }
        .nav {
            margin-bottom: 20px;
        }
        .nav a {
            color: #88c0d0;
            text-decoration: none;
            margin-right: 20px;
        }
        .nav a:hover {
            text-decoration: underline;
        }

        /* Search Section */
        .search-section {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #0f0f23;
            color: #eee;
            font-size: 14px;
        }
        select {
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #0f0f23;
            color: #eee;
            font-size: 14px;
            min-width: 120px;
        }

        /* Filters Section */
        .filters-section {
            background: #0f0f23;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .filters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .filters-header h3 {
            margin: 0;
            font-size: 14px;
            color: #f0c040;
        }
        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-row select, .filter-row input {
            padding: 8px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            font-size: 13px;
        }
        .filter-row input {
            width: 150px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #4a9eff;
            color: white;
        }
        .btn-primary:hover {
            background: #3a8eef;
        }
        .btn-danger {
            background: #ff4a4a;
            color: white;
        }
        .btn-danger:hover {
            background: #ef3a3a;
        }
        .btn-secondary {
            background: #555;
            color: white;
        }
        .btn-secondary:hover {
            background: #666;
        }

        /* Sort Section */
        .sort-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        .sort-section label {
            font-size: 14px;
        }

        /* Results Section */
        .results-section {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .results-count {
            color: #888;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #ff4a4a;
        }

        /* Table */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .results-table th, .results-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        .results-table th {
            background: #0f0f23;
            color: #f0c040;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .results-table th:hover {
            background: #1a1a3e;
        }
        .results-table th.sorted-asc::after {
            content: ' ▲';
            font-size: 10px;
        }
        .results-table th.sorted-desc::after {
            content: ' ▼';
            font-size: 10px;
        }
        .results-table tr:hover {
            background: #1a1a3e;
        }
        .jobs-list, .slots-list {
            font-size: 11px;
            color: #88c0d0;
        }
        .description {
            white-space: pre-line;
        }
        .stat-highlight {
            background-color: #f0c040;
            color: #1a1a2e;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .pagination button {
            padding: 8px 16px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #0f0f23;
            color: #eee;
            cursor: pointer;
        }
        .pagination button:hover:not(:disabled) {
            background: #1a1a3e;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .pagination .page-info {
            padding: 8px 16px;
            color: #888;
        }

        @media (max-width: 768px) {
            .search-row, .filter-row {
                flex-direction: column;
            }
            .search-input, select, .filter-row input {
                width: 100%;
            }
            .results-table {
                font-size: 12px;
            }
            .results-table th, .results-table td {
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html">ステータス計算</a>
            <a href="search.html">装備検索</a>
        </nav>

        <header class="page-header">
            <h1>FFXI 装備検索</h1>
            <div id="auth-ui" class="auth-ui"></div>
        </header>

        <div class="search-section">
            <div class="search-row">
                <input type="text" id="searchQuery" class="search-input" placeholder="装備名で検索...">
                <select id="slotsFilter">
                    <option value="">全スロット</option>
                    <option value="main">メイン</option>
                    <option value="sub">サブ</option>
                    <option value="range">遠隔</option>
                    <option value="ammo">矢弾</option>
                    <option value="head">頭</option>
                    <option value="body">胴</option>
                    <option value="hands">両手</option>
                    <option value="legs">両脚</option>
                    <option value="feet">両足</option>
                    <option value="neck">首</option>
                    <option value="waist">腰</option>
                    <option value="ear1">耳</option>
                    <option value="ring1">指</option>
                    <option value="back">背</option>
                </select>
                <select id="jobsFilter">
                    <option value="">All Jobs</option>
                    <option value="WAR">戦</option>
                    <option value="MNK">モ</option>
                    <option value="WHM">白</option>
                    <option value="BLM">黒</option>
                    <option value="RDM">赤</option>
                    <option value="THF">シ</option>
                    <option value="PLD">ナ</option>
                    <option value="DRK">暗</option>
                    <option value="BST">獣</option>
                    <option value="BRD">吟</option>
                    <option value="RNG">狩</option>
                    <option value="SAM">侍</option>
                    <option value="NIN">忍</option>
                    <option value="DRG">竜</option>
                    <option value="SMN">召</option>
                    <option value="BLU">青</option>
                    <option value="COR">コ</option>
                    <option value="PUP">か</option>
                    <option value="DNC">踊</option>
                    <option value="SCH">学</option>
                    <option value="GEO">風</option>
                    <option value="RUN">剣</option>
                </select>
                <label id="ilv119Label" style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="ilv119Filter" checked>
                    <span>iLv119のみ</span>
                </label>
            </div>

            <div class="filters-section">
                <div class="filters-header">
                    <h3>フィルター</h3>
                    <button class="btn btn-secondary" id="addFilterBtn">+ フィルター追加</button>
                </div>
                <div id="filtersContainer"></div>
            </div>

            <div class="sort-section">
                <label>ソート:</label>
                <select id="sortBy">
                    <option value="ja">名前</option>
                    <option value="level">Lv</option>
                    <option value="item_level">iLv</option>
                    <option value="category">カテゴリ</option>
                    <option value="desc_stat">説明文ステータス</option>
                </select>
                <input type="text" id="descStatInput" placeholder="例: STR, 攻" style="display: none; width: 100px;">
                <select id="sortOrder">
                    <option value="asc">昇順</option>
                    <option value="desc">降順</option>
                </select>
                <button class="btn btn-primary" id="searchBtn">検索</button>
            </div>
        </div>

        <div class="results-section">
            <div class="results-header">
                <span class="results-count" id="resultsCount">読み込み中...</span>
            </div>
            <div id="resultsContainer">
                <div class="loading">データを読み込み中...</div>
            </div>
            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevBtn">前へ</button>
                <span class="page-info" id="pageInfo"></span>
                <button id="nextBtn">次へ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { startSearchPage } from './js/search-page.js';
        startSearchPage();
    </script>
</body>
</html>
