name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # 上流 (Windower/Resources) の更新をこちらの push と無関係に取り込むための定期実行。
  # items.json はビルド時に上流から生成するため (docs/adr/0003)、再デプロイしない限り
  # 配信中のデータが古いままになる。cron は UTC 指定: 15:00 UTC = 00:00 JST。
  schedule:
    - cron: '0 15 * * *'
  # 上流更新を即座に取り込みたいときの手動トリガー。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 上流 (Windower/Resources) のリソースに変化があるかだけを先に判定する軽量ジョブ。
  # 前回ビルド時の blob SHA は、配信済みサイトの data/_build_metadata.json に
  # 記録してある (docs/adr/0003)。取得に失敗した場合は changed=true に倒し、
  # 「判定できないならビルドする」安全側の挙動にする。
  detect-resource-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      blobs: ${{ steps.detect.outputs.blobs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes in upstream resources
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/_build_metadata.json
        run: scripts/detect_resource_changes.sh >> "$GITHUB_OUTPUT"

  build:
    needs: detect-resource-changes
    # push / workflow_dispatch は無条件、schedule は上流に変化があるときだけビルドする。
    if: github.event_name != 'schedule' || needs.detect-resource-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml に固定したツールチェーンを取得する。rustup はこの
      # ファイルをディレクトリ override として読むため、バージョンをワークフロー側に
      # 書くと二重管理になる。ここでは指定せず rustup に解決させる。
      # (dtolnay/rust-toolchain@stable は rustup default を stable に向けるだけで
      #  ファイルの override には勝てず、stable と固定版の両方を落とすことになる)
      - name: Setup Rust
        run: rustup show active-toolchain

      - name: Run tests
        run: cargo test
        working-directory: rust

      # 版を固定する。以前の init.sh は常に最新を取得するため、開発者の手元
      # (CONTRIBUTING.md で 0.14.0 を指定) と CI で別バージョンになりえた。
      # cargo install はソースビルドで数分かかるので、prebuilt を取得できる
      # このアクションを使う。版を上げるときは CONTRIBUTING.md と揃えて変更する。
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Build WASM
        run: |
          cd rust
          wasm-pack build --target web --out-dir ../web/pkg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 上流ファイルの取得 / items.json 生成 / 検証 / _build_metadata.json 出力を
      # 1 コマンドで行う。ローカルでも同じコマンドで web/data/ を再現できる。
      - name: Build web data
        env:
          GH_TOKEN: ${{ github.token }}
          # ${{ }} を直接シェルに展開せず env 経由で渡す (上流由来の値のため)。
          # detect ジョブが取得済みなので、ここで API を引き直さない。
          UPSTREAM_BLOBS: ${{ needs.detect-resource-changes.outputs.blobs }}
          COMMIT: ${{ github.sha }}
        run: scripts/build_web_data.sh

      - name: Generate Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > web/js/config.js <<EOF
          export const SUPABASE_URL = '${SUPABASE_URL}';
          export const SUPABASE_ANON_KEY = '${SUPABASE_ANON_KEY}';
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
